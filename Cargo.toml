[workspace]
resolver = "2"
members = ["crates/emd-core", "crates/emd-daemon", "crates/emd-app"]
# Tauri 壳带两百多个依赖，全量 `cargo build` 会把它一起拖慢。
# 需要它时用 `cargo build -p emd-app` 或 `cargo tauri dev`。
# 注意：默认 `cargo test` 会静默跳过 emd-app 的测试，验证一律用
# `cargo test -p emd-core -p emd-daemon -p emd-app`（见 AGENTS.md）。
default-members = ["crates/emd-core", "crates/emd-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", features = ["gzip", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
httpdate = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
fs2 = "0.3"
base64 = "0.22"
sha2 = "0.10"
# 钉钉加签用 HMAC-SHA256（M4c T10）。取 0.12 而不是最新的 0.13：0.12 与既有 sha2 0.10
# 同属 digest 0.10 那一代，0.13 起换 digest 0.11，会把 sha2 分裂成两套不兼容的 trait。
hmac = "0.12"
urlencoding = "2"
getrandom = "0.2"
# default-features = false 只留 windows-native，避免默认拖入 linux secret-service 依赖链
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# SSO 回环回调只收一个 GET，用它的 recv_timeout + 请求解析即可；
# 不引 async HTTP 服务端框架（登录是用户手点的一次性动作）。
tiny_http = "0.12"

emd-core = { path = "crates/emd-core" }

[profile.release]
lto = "thin"
codegen-units = 4
